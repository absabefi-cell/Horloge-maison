<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Horloge + Cloche — version ajustée</title>
<style>
  :root { --bg:#0a0f1a; --fg:#eaf2fb; --yellow:#ffeb3b; --ring:#3a6cc9; }
  *{ box-sizing:border-box }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--fg);
             font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif; }

  header{ padding:8px 10px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center }
  .btn{ background:#16294a; border:1px solid var(--ring); color:var(--fg); padding:8px 12px; border-radius:12px; font-weight:700 }
  .btn:disabled{ opacity:.6 }
  label{ font-size:.95rem; opacity:.9 }
  input,select{ background:#0d1a33; border:1px solid var(--ring); color:var(--fg); border-radius:10px; padding:6px 8px }
  input[type="number"]{ width:92px }
  input[type="range"]{ width:140px }

  .stage{ height:calc(100svh - 190px); display:grid; place-items:center; padding:6px }
  .clock{ width:min(92vmin, 900px); aspect-ratio:1/1; transform:translateY(-30px); } /* <-- remontée vers le haut */
  svg{ display:block; user-select:none; -webkit-user-select:none; touch-action:manipulation }

  .card{ width:min(940px,96vw); border:1px solid var(--ring); border-radius:14px; padding:10px; background:#0f1622; margin:8px auto 0 }
  .mono{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.95rem }
  .ok{ color:#9be28c } .warn{ color:#ff9898 }
</style>
</head>
<body>
<header>
  <button id="soundBtn" class="btn">🔊 Activer le son</button>
  <button id="chooseBtn" class="btn">🔔 Choisir cloche.mp3</button>

  <label for="first">First(s)</label><input id="first" type="number" step="0.01" min="0" value="4.5">
  <label for="step">Step(s)</label><input id="step" type="number" step="0.001" min="0" value="1.47">
  <label for="useful">Utile(s)</label><input id="useful" type="number" step="0.01" min="0" placeholder="(auto)">
  <label for="offset">Offset(ms)</label><input id="offset" type="number" step="10" min="0" value="0">
  <label for="bellVol">Vol cloche</label><input id="bellVol" type="range" min="0" max="1" step="0.01" value="1">

  <!-- menu n supprimé -->
  <button id="testFirst" class="btn" disabled>▶️ 1er coup</button>
  <button id="testCum" class="btn"   disabled>▶️ 0→12</button>
  <button id="testNow" class="btn"   disabled>🕛 Heure actuelle</button>

  <button id="fs" class="btn">⛶ Plein écran</button>
  <input id="file" type="file" accept="audio/*" hidden />
</header>

<div class="stage">
  <svg class="clock" viewBox="0 0 1000 1000" aria-label="Horloge">
    <defs>
      <radialGradient id="gDial" cx="50%" cy="42%" r="70%">
        <stop offset="0%"  stop-color="#2860ba"/>
        <stop offset="70%" stop-color="#123a85"/>
        <stop offset="100%" stop-color="#0a1730"/>
      </radialGradient>
      <filter id="glowHands" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowText" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <circle cx="500" cy="500" r="470" fill="url(#gDial)" stroke="#3a6cc9" stroke-width="18" />
    <g id="minTicks" opacity=".28" stroke="#c9dcff"><g id="mTick"><line x1="500" y1="74" x2="500" y2="98" stroke-width="7"/></g></g>
    <g id="numbers" fill="var(--yellow)" stroke="#000" stroke-width="6" stroke-linejoin="round"
       font-size="90" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif"
       text-anchor="middle" dominant-baseline="middle" filter="url(#glowText)"></g>
    <g id="hands" stroke="var(--yellow)" stroke-linecap="round" filter="url(#glowHands)">
      <line id="hHour"   x1="500" y1="500" x2="500" y2="260" stroke-width="16"/>
      <line id="hMinute" x1="500" y1="500" x2="500" y2="200" stroke-width="10"/>
      <line id="hSecond" x1="500" y1="520" x2="500" y2="180" stroke="#fffab0" stroke-width="6"/>
      <circle cx="500" cy="500" r="14" fill="var(--yellow)" stroke="#000" stroke-width="4"/>
    </g>
  </svg>
</div>

<div class="card mono">
  <div id="status">Charge ton MP3. À XX:30 → First. À XX:00 → First + (12−1)×Step.</div>
  <div id="summary">—</div>
</div>

<script>
/* --- dessin horloge --- */
(function(){
  const g=document.getElementById('minTicks');
  for(let i=0;i<60;i++){
    const u=document.createElementNS('http://www.w3.org/2000/svg','use');
    u.setAttributeNS('http://www.w3.org/1999/xlink','href','#mTick');
    u.setAttribute('transform',`rotate(${i*6} 500 500)`);
    g.appendChild(u);
  }
})();
(function(){
  const g=document.getElementById('numbers'); const cx=500, cy=500, r=430;
  for(let i=1;i<=12;i++){
    const a=(i-3)*30*Math.PI/180, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x.toFixed(1)); t.setAttribute('y',y.toFixed(1)); t.textContent=i; g.appendChild(t);
  }
})();
const hH=document.getElementById('hHour'), hM=document.getElementById('hMinute'), hS=document.getElementById('hSecond');
(function loop(){
  const now=new Date();
  const s=now.getSeconds()+now.getMilliseconds()/1000;
  const m=now.getMinutes()+s/60;
  const h=(now.getHours()%12)+m/60;
  hS.setAttribute('transform',`rotate(${s*6} 500 500)`);
  hM.setAttribute('transform',`rotate(${m*6} 500 500)`);
  hH.setAttribute('transform',`rotate(${h*30} 500 500)`);
  requestAnimationFrame(loop);
})();

/* --- cloche audio --- */
let audioCtx,bellBuffer,bellGain;let lastHour=-1,lastHalfKey="";
const firstEl=first,stepEl=step,usefulEl=useful,offsetEl=offset,bellVolEl=bellVol;
const fmt=s=>Math.round(s*100)/100+"s";
function ensureAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();bellGain=audioCtx.createGain();bellGain.connect(audioCtx.destination);}}
async function resumeAudio(){ensureAudio();if(audioCtx.state==='suspended')await audioCtx.resume();soundBtn.disabled=true;}
bellVolEl.oninput=()=>{if(bellGain)bellGain.gain.value=parseFloat(bellVolEl.value);};
soundBtn.onclick=resumeAudio;chooseBtn.onclick=()=>file.click();
file.onchange=async()=>{const f=file.files?.[0];if(!f)return;await resumeAudio();const arr=await f.arrayBuffer();bellBuffer=await audioCtx.decodeAudioData(arr);status.textContent=`Cloche chargée ✅ (${f.name}, ${fmt(bellBuffer.duration)})`;testFirst.disabled=false;testCum.disabled=false;refresh();};
function getT(){const total=bellBuffer?bellBuffer.duration:0;const offset=parseInt(offsetEl.value||0)/1000;const manual=parseFloat(usefulEl.value||'');const useful=!isNaN(manual)&&manual>0?manual:Math.max(0,total-offset);const first=parseFloat(firstEl.value||0);const step=parseFloat(stepEl.value||0);const implied=first+11*step;return{total,offset,useful,first,step,implied,delta:useful-implied};}
function refresh(){const{total,offset,useful,first,step,implied,delta}=getT();summary.innerHTML=bellBuffer?`Total=${fmt(total)} | Offset=${fmt(offset)} | Utile=${fmt(useful)} | First=${fmt(first)} | Step=${fmt(step)} | Total impl.=${fmt(implied)} <span class="${Math.abs(delta)<.25?'ok':'warn'}">(écart ${fmt(delta)})</span>`:'—';}
[firstEl,stepEl,usefulEl,offsetEl].forEach(e=>e.addEventListener('input',refresh));
function playRange(start,dur){if(!bellBuffer)return;const t0=audioCtx.currentTime;const src=audioCtx.createBufferSource();src.buffer=bellBuffer;const g=audioCtx.createGain();g.gain.value=1;src.connect(g).connect(bellGain);src.start(t0,start,dur);src.stop(t0+dur+.05);}
testFirst.onclick=()=>{resumeAudio();const{offset,first}=getT();playRange(offset,first);};
testCum.onclick=()=>{resumeAudio();const{offset,useful,first,step}=getT();const dur=Math.min(useful,first+11*step);playRange(offset,dur);};
testNow.onclick=()=>{const now=new Date();const h12=(now.getHours()%12)||12;const{offset,useful,first,step}=getT();const dur=Math.min(useful,first+(h12-1)*step);playRange(offset,dur);};
(function tick(){const now=new Date(),w=1000-now.getMilliseconds();setTimeout(()=>{const t=new Date(),s=t.getSeconds(),m=t.getMinutes(),h=t.getHours(),h12=(h%12)||12;if(m===30&&s===0){const k=`half-${t.toDateString()}-${h}`;if(k!==lastHalfKey){lastHalfKey=k;const{offset,first}=getT();playRange(offset,first);}}if(m===0&&s===0&&h!==lastHour){lastHour=h;const{offset,useful,first,step}=getT();const d=Math.min(useful,first+(h12-1)*step);playRange(offset,d);}tick();},w);})();
</script>
</body>
  </html>
